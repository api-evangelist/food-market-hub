aid: food-market-hub
name: Food Market Hub
description: >-
  Food Market Hub is a cloud-based procurement, inventory, and supply-chain
  management platform for food-and-beverage businesses, founded in Malaysia and
  headquartered in Petaling Jaya, Selangor. It automates back-end operations for
  restaurants, cafes, and central kitchens — connecting F&B outlets with their
  suppliers and central kitchens to handle purchase-order creation, smart
  ordering, inventory tracking, food-cost and wastage control, supplier
  management, and real-time reporting. The platform serves brands such as KFC,
  Pizza Hut, Salad Atelier, and Kenny Hills alongside thousands of independent
  restaurants across Southeast Asia (Malaysia, Indonesia, and China), and is
  delivered through web and iOS/Android mobile apps. Food Market Hub is a 500
  Global portfolio company. As of this profile the company exposes no public
  developer API, developer portal, or API documentation; integrations
  (including POS sales-data connections) are handled directly by the company.
